@if (!this.editing)
{
  <h2>{{userService.user()?.name}} {{userService.user()?.lastName}}</h2>
  <p>{{userService.user()?.email}}</p>
  <p>{{this.getRole()}} - ID: {{userService.user()?.id}}</p>
  <button (click)="this.changeMode()">Editar</button>
}
@else
{
  <form [formGroup]="formulario">
      <div>
          <label for="name">Nombre:</label>
          <input type="name" formControlName="name" id="name">
      </div>

      <div>
          <label for="lastName">Apellido:</label>
          <input type="lastName" formControlName="lastName" id="lastName">
      </div>

      <p>{{userService.user()?.email}}</p>
      <p>{{this.getRole()}} - ID: {{userService.user()?.id}}</p>

      <button (click)="this.changeMode(true)" [disabled]="formulario.invalid">Guardar</button>
      <button (click)="this.changeMode()" >Cancelar</button>
  </form>
}
